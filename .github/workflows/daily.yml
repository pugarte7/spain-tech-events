name: daily

# Crawls every source and publishes events.json with the MCP server at /mcp.
# Needs the secrets VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID; without
# the token it crawls and tests but does not deploy.
on:
  schedule:
    - cron: "37 4 * * *"   # 05:37 in Madrid in winter, 06:37 in summer
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      EVENTS_PREVIOUS_URL: ${{ vars.SITE_URL && format('{0}/api/v1/events.json', vars.SITE_URL) || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
      - name: Crawl only
        if: env.VERCEL_TOKEN == ''
        run: node scripts/events.mjs
      - name: Crawl and deploy
        if: env.VERCEL_TOKEN != ''
        run: |
          npm install --global vercel@latest
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
