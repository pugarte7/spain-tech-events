name: daily

# Crawls every source each morning and commits data/events.json. Vercel
# deploys every push to main from its Git integration, copying that file to
# /api/v1/events.json beside the MCP server at /mcp, so no deploy token lives
# here. A source that fails keeps its events from the committed index.
on:
  schedule:
    - cron: "37 4 * * *"   # 05:37 in Madrid in winter, 06:37 in summer
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test

  crawl:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/events.mjs --out data/events.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Commit the index
        run: |
          git add data/events.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898283+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Events $(date -u +%F)"
          git push -q
