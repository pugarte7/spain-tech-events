name: daily

# Crawls every source each morning and commits data/events.json. Vercel
# deploys every push to main from its Git integration, copying that file to
# /api/v1/events.json beside the MCP server at /mcp, so no deploy token lives
# here. A source that fails keeps its events from the committed index.
on:
  schedule:
    - cron: "37 4 * * *"   # 05:37 in Madrid in winter, 06:37 in summer
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test

  crawl:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Whether the dedicated X login is configured; the login itself is only
      # given to the step that uses it.
      HAS_X: ${{ secrets.X_STORAGE_STATE != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        if: env.HAS_X == 'true'
        with:
          python-version: "3.12"
      # Skipped without the login. A failure here (an expired login, X refusing
      # the browser) must not cost the day's crawl: the X source then keeps its
      # last known events, like any other source that fails.
      - name: Read X
        if: env.HAS_X == 'true'
        continue-on-error: true
        timeout-minutes: 20
        env:
          X_STORAGE_STATE: ${{ secrets.X_STORAGE_STATE }}
        run: |
          pip install --quiet "scrapling[fetchers]"
          scrapling install
          python scripts/x-fetch.py
      - run: node scripts/events.mjs --out data/events.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
          X_EXPECTED: ${{ env.HAS_X == 'true' && '1' || '' }}
      - name: Commit the index
        run: |
          git add data/events.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898283+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Events $(date -u +%F)"
          git push -q
